name: CI
on: [push, pull_request]

jobs:
  notion-checkbox-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore active watchdog projects
        run: |
          set -euo pipefail
          for project in \
            src/BKE.Worker.Core/BKE.Worker.Core.csproj \
            src/BKE.Worker.ChatGPT/BKE.Worker.ChatGPT.csproj \
            src/BKE.Worker.Notion/BKE.Worker.Notion.csproj \
            src/BKE.Worker.Server/BKE.Worker.Server.csproj \
            src/BKE.Worker.Platform.Windows/BKE.Worker.Platform.Windows.csproj \
            src/BKE.Worker.Platform.MacOS/BKE.Worker.Platform.MacOS.csproj \
            tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj \
            tests/BKE.Worker.Notion.Tests/BKE.Worker.Notion.Tests.csproj \
            tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          do dotnet restore "$project"; done

      - name: Build active watchdog projects
        run: |
          set -euo pipefail
          for project in \
            src/BKE.Worker.Core/BKE.Worker.Core.csproj \
            src/BKE.Worker.ChatGPT/BKE.Worker.ChatGPT.csproj \
            src/BKE.Worker.Notion/BKE.Worker.Notion.csproj \
            src/BKE.Worker.Server/BKE.Worker.Server.csproj \
            src/BKE.Worker.Platform.Windows/BKE.Worker.Platform.Windows.csproj \
            src/BKE.Worker.Platform.MacOS/BKE.Worker.Platform.MacOS.csproj \
            tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj \
            tests/BKE.Worker.Notion.Tests/BKE.Worker.Notion.Tests.csproj \
            tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          do dotnet build "$project" --configuration Release --no-restore; done

      - name: Execute Core tests
        run: dotnet test tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj --configuration Release --no-build
      - name: Execute Notion tests
        run: dotnet test tests/BKE.Worker.Notion.Tests/BKE.Worker.Notion.Tests.csproj --configuration Release --no-build
      - name: Install Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Execute ChatGPT adapter tests
        run: dotnet test tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj --configuration Release --no-build
      - name: Publish watchdog server
        run: dotnet publish src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-build --output artifacts/bke-worker-server

      - name: Certify fail-closed session runtime and retired webhook route
        run: |
          set -euo pipefail
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          export BKE_WORKER_STATE_FILE="$RUNNER_TEMP/bke-worker-watchdog/state.json"
          export BKE_WORKER_CHATGPT_PROFILE="$RUNNER_TEMP/bke-worker-watchdog/chatgpt-profile"
          dotnet artifacts/bke-worker-server/BKE.Worker.Server.dll > "$RUNNER_TEMP/bke-worker-watchdog.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5080/health/live >/dev/null; then break; fi
            sleep 1
          done
          ready_code=$(curl --silent --output "$RUNNER_TEMP/ready.json" --write-out '%{http_code}' http://127.0.0.1:5080/health/ready)
          test "$ready_code" = "503"
          grep -q '"notionConnected":false' "$RUNNER_TEMP/ready.json"
          grep -q '"chatGptTargetConnected":false' "$RUNNER_TEMP/ready.json"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5080/webhooks/github)" = "404"

      - name: Certify operator session controls
        run: |
          set -euo pipefail
          ui=src/BKE.Worker.Server/wwwroot/index.html
          grep -q 'Notion integration secret' "$ui"
          grep -q 'Exact ChatGPT conversation URL' "$ui"
          grep -q '/control/notion/connect' "$ui"
          grep -q '/control/chatgpt/connect' "$ui"
          grep -q '/control/chatgpt/disconnect' "$ui"
          grep -q 'Refresh Notion lists' "$ui"
          grep -q 'projectRefreshMs=30000' "$ui"
          grep -q 'Start watchdog' "$ui"
          grep -q 'ENGINEERING:' "$ui"

      - name: Certify env account authority is retired
        run: |
          set -euo pipefail
          active=(src/BKE.Worker.Server scripts/bke-worker.env.example README.md docs/notion-control-page-template.md)
          for retired in BKE_WORKER_NOTION_PAGE BKE_WORKER_NOTION_TOKEN BKE_WORKER_CHATGPT_OVERRIDE_URL; do
            if grep -R --line-number "$retired" "${active[@]}"; then
              echo "ERROR: retired environment authority leaked into active runtime/docs: $retired" >&2
              exit 1
            fi
          done
          grep -q 'operator-ui-memory-only' src/BKE.Worker.Server/Program.cs
          grep -q 'CHATGPT_TARGET_NOT_CONNECTED' src/BKE.Worker.Server/ChatGptRuntimeTarget.cs
          grep -q 'OverrideUrl: null' src/BKE.Worker.Server/NotionCheckboxWatchdog.cs

      - uses: actions/upload-artifact@v4
        with:
          name: bke-worker-notion-checkbox-watchdog-linux-portable
          path: artifacts/bke-worker-server/**
          if-no-files-found: error
