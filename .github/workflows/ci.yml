name: CI
on: [push, pull_request]

jobs:
  notion-checkbox-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore active watchdog projects
        run: |
          set -euo pipefail
          for project in \
            src/BKE.Worker.Core/BKE.Worker.Core.csproj \
            src/BKE.Worker.ChatGPT/BKE.Worker.ChatGPT.csproj \
            src/BKE.Worker.Notion/BKE.Worker.Notion.csproj \
            src/BKE.Worker.Server/BKE.Worker.Server.csproj \
            src/BKE.Worker.Platform.Windows/BKE.Worker.Platform.Windows.csproj \
            src/BKE.Worker.Platform.MacOS/BKE.Worker.Platform.MacOS.csproj \
            tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj \
            tests/BKE.Worker.Notion.Tests/BKE.Worker.Notion.Tests.csproj \
            tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          do
            echo "RESTORE $project"
            dotnet restore "$project"
          done

      - name: Build active watchdog projects
        run: |
          set -euo pipefail
          for project in \
            src/BKE.Worker.Core/BKE.Worker.Core.csproj \
            src/BKE.Worker.ChatGPT/BKE.Worker.ChatGPT.csproj \
            src/BKE.Worker.Notion/BKE.Worker.Notion.csproj \
            src/BKE.Worker.Server/BKE.Worker.Server.csproj \
            src/BKE.Worker.Platform.Windows/BKE.Worker.Platform.Windows.csproj \
            src/BKE.Worker.Platform.MacOS/BKE.Worker.Platform.MacOS.csproj \
            tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj \
            tests/BKE.Worker.Notion.Tests/BKE.Worker.Notion.Tests.csproj \
            tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          do
            echo "BUILD $project"
            dotnet build "$project" --configuration Release --no-restore
          done

      - name: Execute Core tests
        run: dotnet test tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Execute Notion tests
        run: dotnet test tests/BKE.Worker.Notion.Tests/BKE.Worker.Notion.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Install Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Execute ChatGPT adapter tests
        run: dotnet test tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish watchdog server
        run: dotnet publish src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-build --output artifacts/bke-worker-server

      - name: Certify fail-closed unconfigured runtime and retired webhook route
        run: |
          set -euo pipefail
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          export BKE_WORKER_STATE_FILE="$RUNNER_TEMP/bke-worker-watchdog/state.json"
          export BKE_WORKER_CHATGPT_PROFILE="$RUNNER_TEMP/bke-worker-watchdog/chatgpt-profile"

          dotnet artifacts/bke-worker-server/BKE.Worker.Server.dll > "$RUNNER_TEMP/bke-worker-watchdog.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5080/health/live >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:5080/health/live | grep -q '"runtime":"notion-checkbox-watchdog"'

          ready_code=$(curl --silent --output "$RUNNER_TEMP/ready.json" --write-out '%{http_code}' http://127.0.0.1:5080/health/ready)
          test "$ready_code" = "503"
          grep -q '"status":"not_ready"' "$RUNNER_TEMP/ready.json"

          webhook_code=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5080/webhooks/github)
          test "$webhook_code" = "404"

          projects_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5080/control/projects)
          test "$projects_code" = "503"

          options_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5080/control/options)
          test "$options_code" = "503"

      - name: Certify minimal operator surface contract
        run: |
          set -euo pipefail
          ui=src/BKE.Worker.Server/wwwroot/index.html
          grep -q 'Engineering project' "$ui"
          grep -q 'ENGINEERING:' "$ui"
          grep -q 'Notion task / TODO' "$ui"
          grep -q 'Durable instruction' "$ui"
          grep -q 'Start watchdog' "$ui"
          grep -q 'Names discover' "$ui"
          grep -q 'Unchecked + ChatGPT busy' "$ui"
          if grep -q 'GitHub webhook' "$ui"; then
            echo 'ERROR: webhook-era control leaked into minimal watchdog UI' >&2
            exit 1
          fi
          if grep -q '>Repository<' "$ui"; then
            echo 'ERROR: repository selector/control leaked into minimal watchdog UI' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bke-worker-notion-checkbox-watchdog-linux-portable
          path: artifacts/bke-worker-server/**
          if-no-files-found: error
