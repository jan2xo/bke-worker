name: Intent Certification

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact BKE Worker commit SHA to certify
        required: true
        type: string
      modules:
        description: "Space-separated modules: core server chatgpt android android-preproduction android-release relay"
        required: true
        default: core
        type: string
      publish_preproduction:
        description: Publish a durable PREPRODUCTION prerelease after certification (workflow_dispatch only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: bke-worker-intent-${{ (github.event_name == 'issue_comment' && github.event.issue.number) || inputs.source_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve certification intent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/certify '))
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      core: ${{ steps.plan.outputs.core }}
      server: ${{ steps.plan.outputs.server }}
      chatgpt: ${{ steps.plan.outputs.chatgpt }}
      android: ${{ steps.plan.outputs.android }}
      android_preproduction: ${{ steps.plan.outputs.android_preproduction }}
      android_release: ${{ steps.plan.outputs.android_release }}
      relay: ${{ steps.plan.outputs.relay }}
    steps:
      - id: plan
        name: Resolve exact head and requested modules
        uses: actions/github-script@v7
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          DISPATCH_MODULES: ${{ inputs.modules }}
        with:
          script: |
            let sourceSha;
            let rawModules;

            if (context.eventName === "issue_comment") {
              const association = context.payload.comment?.author_association ?? "NONE";
              const allowed = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
              if (!allowed.has(association)) {
                core.setFailed(`Certification rejected for author association ${association}.`);
                return;
              }

              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              sourceSha = response.data.head.sha;
              rawModules = (context.payload.comment?.body ?? "")
                .replace(/^\/certify\s+/, "")
                .trim();
            } else {
              sourceSha = (process.env.DISPATCH_SHA ?? "").trim();
              rawModules = (process.env.DISPATCH_MODULES ?? "").trim();
            }

            if (!/^[0-9a-f]{40}$/.test(sourceSha ?? "")) {
              core.setFailed("Certification requires an exact lowercase 40-character source SHA.");
              return;
            }

            const requested = new Set(
              rawModules.split(/\s+/).filter(Boolean)
            );
            const allowedModules = new Set(["core", "server", "chatgpt", "android", "android-preproduction", "android-release", "relay"]);
            const unknown = [...requested].filter(module => !allowedModules.has(module));
            if (requested.size === 0 || unknown.length > 0) {
              core.setFailed(
                `Certification modules must be one or more of core server chatgpt android android-preproduction android-release relay. Unknown: ${unknown.join(", ")}`
              );
              return;
            }

            core.setOutput("source_sha", sourceSha);
            for (const module of allowedModules) {
              const outputName = module.replace("-", "_");
              core.setOutput(outputName, requested.has(module) ? "true" : "false");
            }

  core:
    name: Core orchestration + GitHub boundary
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore canonical core tests
        run: |
          dotnet restore tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj
          dotnet restore tests/BKE.Worker.GitHub.Tests/BKE.Worker.GitHub.Tests.csproj

      - name: Build canonical core tests
        run: |
          dotnet build tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj -c Release --no-restore
          dotnet build tests/BKE.Worker.GitHub.Tests/BKE.Worker.GitHub.Tests.csproj -c Release --no-restore

      - name: Execute core orchestration tests
        run: dotnet test tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Execute signed GitHub webhook tests
        run: dotnet test tests/BKE.Worker.GitHub.Tests/BKE.Worker.GitHub.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Execute serial Master Queue dispatcher contract
        run: python3 tests/serial_dispatcher_contract.py

      - name: Verify GitHub-native authority boundary
        shell: python
        run: |
          from pathlib import Path

          canonical = [
              Path("src/BKE.Worker.Core"),
              Path("src/BKE.Worker.GitHub"),
              Path("src/BKE.Worker.Server"),
              Path("src/BKE.Worker.ChatGPT"),
              Path("tests/BKE.Worker.Core.Tests"),
              Path("tests/BKE.Worker.GitHub.Tests"),
              Path("scripts/bke-worker.env.example"),
              Path("scripts/run-worker.sh"),
              Path("README.md"),
              Path("BKE-WORKER-CANONICAL-PROJECT-EXECUTION-INSTRUCTIONS.md"),
              Path("docs/autonomous-engineering.md"),
              Path("docs/multi-worker-pr-delegation.md"),
              Path("BKE.Worker.sln"),
          ]

          text = ""
          for item in canonical:
              if item.is_dir():
                  for path in item.rglob("*"):
                      if path.is_file() and path.suffix in {".cs", ".csproj", ".md"}:
                          text += path.read_text(encoding="utf-8") + "\n"
              elif item.is_file():
                  text += item.read_text(encoding="utf-8") + "\n"

          forbidden = [
              "BKE_WORKER_NOTION_",
              "IChecklistReconciler",
              "NotionPageId",
              "ContinueFromNotionChecklist",
              "BKE.Worker.Notion",
          ]
          present = [token for token in forbidden if token.lower() in text.lower()]
          if present:
              raise SystemExit(
                  "Canonical Worker still contains Notion authority: "
                  + ", ".join(present)
              )

          prompt = Path("src/BKE.Worker.Core/Contracts.cs").read_text(encoding="utf-8")
          for token in [
              "ContinueAutonomousEngineering",
              "BKE-WORKER-CANONICAL-PROJECT-EXECUTION-INSTRUCTIONS.md",
              "current main of jan2xo/bke-worker",
              "live GitHub state",
              "fresh branch from current main",
              "NEW PR",
              ".github/pull_request_template.md",
              "Do not invent unqueued work",
              "WORKER OWNERSHIP LOCK",
              "expected head SHA=",
              "bke-worker:",
          ]:
              if token not in prompt:
                  raise SystemExit(f"Locked autonomous prompt lost: {token}")

          print("GitHub-native authority boundary: PASS")

      - name: Diff hygiene
        run: git diff --check

  chatgpt:
    name: Controlled ChatGPT adapter
    needs: plan
    if: needs.plan.outputs.chatgpt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build ChatGPT adapter tests
        run: |
          dotnet restore tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          dotnet build tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj -c Release --no-restore

      - name: Install controlled Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Execute controlled semantic adapter tests
        run: dotnet test tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Diff hygiene
        run: git diff --check

  server:
    name: Published server + operator surface
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore server and browser test projects
        run: |
          dotnet restore src/BKE.Worker.Server/BKE.Worker.Server.csproj
          dotnet restore tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          dotnet restore tests/BKE.Worker.Server.Ui.Tests/BKE.Worker.Server.Ui.Tests.csproj

      - name: Build server and browser test projects
        run: |
          dotnet build src/BKE.Worker.Server/BKE.Worker.Server.csproj -c Release --no-restore
          dotnet build tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj -c Release --no-restore
          dotnet build tests/BKE.Worker.Server.Ui.Tests/BKE.Worker.Server.Ui.Tests.csproj -c Release --no-restore

      - name: Install controlled Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Publish canonical Worker server
        run: dotnet publish src/BKE.Worker.Server/BKE.Worker.Server.csproj -c Release --no-build -o artifacts/bke-worker-server

      - name: Verify published runtime excludes Notion
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/bke-worker-server/BKE.Worker.Server.dll
          test -f artifacts/bke-worker-server/BKE.Worker.Core.dll
          test -f artifacts/bke-worker-server/BKE.Worker.ChatGPT.dll
          test -f artifacts/bke-worker-server/BKE.Worker.GitHub.dll
          test ! -e artifacts/bke-worker-server/BKE.Worker.Notion.dll

      - name: GitHub-native published-runtime harness
        run: bash tests/integration/github_native_server.sh

      - name: GitHub-native operator UI harness
        run: bash tests/integration/github_native_ui.sh

      - name: Verify deployment unit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ExecStart=/usr/bin/dotnet /opt/bke-worker/BKE.Worker.Server.dll' deploy/systemd/bke-worker.service
          grep -q 'EnvironmentFile=/etc/bke-worker/bke-worker.env' deploy/systemd/bke-worker.service
          grep -q 'Restart=on-failure' deploy/systemd/bke-worker.service
          grep -q 'StateDirectoryMode=0700' deploy/systemd/bke-worker.service
          grep -q 'UMask=0077' deploy/systemd/bke-worker.service
          grep -q 'EnvironmentFile=/etc/bke-worker/%i.env' deploy/systemd/bke-worker@.service
          grep -q 'StateDirectoryMode=0700' deploy/systemd/bke-worker@.service
          grep -q 'UMask=0077' deploy/systemd/bke-worker@.service
          systemd-analyze verify deploy/systemd/bke-worker.service
          systemd-analyze verify deploy/systemd/bke-worker@.service

      - name: Upload certified server
        uses: actions/upload-artifact@v4
        with:
          name: bke-worker-server-linux-portable
          path: artifacts/bke-worker-server
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check

  android:
    name: Android Gecko Worker probe
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify Android Gecko probe contract
        run: python3 tests/android_gecko_probe_contract.py

      - name: Verify UTM WSS relay smoke contract
        run: python3 tests/utm_relay_contract.py

      - name: Build Android Gecko debug and recovery-cert APKs
        run: gradle -p android-gecko :app:assembleDebug :app:assembleRecovery --stacktrace

      - name: Verify Android APKs exist
        shell: bash
        run: |
          test -f android-gecko/app/build/outputs/apk/debug/app-debug.apk
          find android-gecko/app/build/outputs/apk/recovery -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload Android Gecko probe APK
        uses: actions/upload-artifact@v4
        with:
          name: bke-worker-android-gecko-probe
          path: android-gecko/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload side-by-side Android recovery-cert APK
        uses: actions/upload-artifact@v4
        with:
          name: bke-worker-android-recovery-cert
          path: android-gecko/app/build/outputs/apk/recovery/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check


  android-preproduction:
    name: Android PREPRODUCTION signed build
    needs: plan
    if: needs.plan.outputs.android_preproduction == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      BKE_ANDROID_PREPRODUCTION_KEYSTORE_B64: ${{ secrets.BKE_ANDROID_PREPRODUCTION_KEYSTORE_B64 }}
      BKE_ANDROID_PREPRODUCTION_STORE_PASSWORD: ${{ secrets.BKE_ANDROID_PREPRODUCTION_STORE_PASSWORD }}
      BKE_ANDROID_PREPRODUCTION_KEY_ALIAS: ${{ secrets.BKE_ANDROID_PREPRODUCTION_KEY_ALIAS }}
      BKE_ANDROID_PREPRODUCTION_KEY_PASSWORD: ${{ secrets.BKE_ANDROID_PREPRODUCTION_KEY_PASSWORD }}
      BKE_ANDROID_PREPRODUCTION_CERT_SHA256: ${{ secrets.BKE_ANDROID_PREPRODUCTION_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Require durable PREPRODUCTION signing identity
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BKE_ANDROID_PREPRODUCTION_KEYSTORE_B64
            BKE_ANDROID_PREPRODUCTION_STORE_PASSWORD
            BKE_ANDROID_PREPRODUCTION_KEY_ALIAS
            BKE_ANDROID_PREPRODUCTION_KEY_PASSWORD
            BKE_ANDROID_PREPRODUCTION_CERT_SHA256
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub PREPRODUCTION-signing secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/bke-worker-preproduction.jks"
          printf '%s' "$BKE_ANDROID_PREPRODUCTION_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "BKE_ANDROID_PREPRODUCTION_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify Android PREPRODUCTION contract
        run: |
          python3 tests/android_gecko_probe_contract.py
          python3 tests/android_preproduction_signing_contract.py

      - name: Build signed Android PREPRODUCTION APK
        run: gradle -p android-gecko :app:assemblePreproduction --stacktrace

      - name: Verify PREPRODUCTION signature, identity, and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="android-gecko/app/build/outputs/apk/preproduction/app-preproduction.apk"
          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner-preproduction.txt"

          SIGNER_SHA256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-preproduction.txt" |
              head -n 1 |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          EXPECTED_SIGNER="$(
            printf '%s' "$BKE_ANDROID_PREPRODUCTION_CERT_SHA256" |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"

          [[ "$SIGNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$SIGNER_SHA256" = "$EXPECTED_SIGNER"

          DEBUGGABLE="$(apkanalyzer manifest debuggable "$APK" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          test "$DEBUGGABLE" = "false"

          PACKAGE_NAME="$(apkanalyzer manifest application-id "$APK" | tr -d '[:space:]')"
          test "$PACKAGE_NAME" = "com.bke.worker.gecko"

          VERSION_NAME="$(apkanalyzer manifest version-name "$APK" | tr -d '[:space:]')"
          VERSION_CODE="$(apkanalyzer manifest version-code "$APK" | tr -d '[:space:]')"
          test -n "$VERSION_NAME"
          test "$VERSION_CODE" = "1"

          mkdir -p artifacts/android-preproduction
          OUTPUT_APK="artifacts/android-preproduction/BKE.Worker.Android.PREPRODUCTION.arm64-v${VERSION_NAME}.apk"
          cp "$APK" "$OUTPUT_APK"
          APK_SHA256="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"

          SOURCE_SHA="$SOURCE_SHA" \
          APK_SHA256="$APK_SHA256" \
          SIGNER_SHA256="$SIGNER_SHA256" \
          VERSION_NAME="$VERSION_NAME" \
          VERSION_CODE="$VERSION_CODE" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "source_sha": os.environ["SOURCE_SHA"],
              "component": "BKE Worker Android Gecko",
              "architecture": "arm64-v8a",
              "version_name": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "sha256": os.environ["APK_SHA256"],
              "signer_certificate_sha256": os.environ["SIGNER_SHA256"],
              "environment": "PREPRODUCTION",
              "certification_state": "preproduction-certified",
          }
          Path("artifacts/android-preproduction/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload signed PREPRODUCTION candidate
        uses: actions/upload-artifact@v4
        with:
          name: bke-worker-android-preproduction-candidate
          path: artifacts/android-preproduction
          if-no-files-found: error
          retention-days: 30

      - name: Diff hygiene
        run: git diff --check

  publish-android-preproduction:
    name: Publish Android PREPRODUCTION prerelease
    needs: [plan, android-preproduction]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_preproduction == true &&
      needs.plan.outputs.android_preproduction == 'true' &&
      needs.android-preproduction.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Require merged-main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - uses: actions/download-artifact@v4
        with:
          name: bke-worker-android-preproduction-candidate
          path: artifacts/android-preproduction

      - name: Publish durable GitHub PREPRODUCTION prerelease
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find artifacts/android-preproduction -maxdepth 1 -type f -name '*.apk' -print -quit)"
          MANIFEST="artifacts/android-preproduction/manifest.json"
          test -n "$APK"
          test -f "$MANIFEST"

          SHORT_SHA="${SOURCE_SHA:0:12}"
          TAG="bke-worker-android-preproduction-$SHORT_SHA"
          TITLE="BKE Worker Android PREPRODUCTION $SHORT_SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$APK" "$MANIFEST" \
              --prerelease \
              --target "$SOURCE_SHA" \
              --title "$TITLE" \
              --notes "PREPRODUCTION only. Exact source: $SOURCE_SHA. Production remains locked."
          fi

  android-release:
    name: Android production release
    needs: plan
    if: needs.plan.outputs.android_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      BKE_ANDROID_KEYSTORE_B64: ${{ secrets.BKE_ANDROID_SIGNING_KEYSTORE_B64 }}
      BKE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BKE_ANDROID_SIGNING_STORE_PASSWORD }}
      BKE_ANDROID_KEY_ALIAS: ${{ secrets.BKE_ANDROID_SIGNING_KEY_ALIAS }}
      BKE_ANDROID_KEY_PASSWORD: ${{ secrets.BKE_ANDROID_SIGNING_KEY_PASSWORD }}
      BKE_ANDROID_SIGNING_CERT_SHA256: ${{ secrets.BKE_ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Require durable production signing identity
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BKE_ANDROID_KEYSTORE_B64
            BKE_ANDROID_KEYSTORE_PASSWORD
            BKE_ANDROID_KEY_ALIAS
            BKE_ANDROID_KEY_PASSWORD
            BKE_ANDROID_SIGNING_CERT_SHA256
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub production-signing secret: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/bke-worker-production.jks"
          printf '%s' "$BKE_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "BKE_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify Android production contract
        run: |
          python3 tests/android_gecko_probe_contract.py
          grep -q 'versionName = "0.0.1"' android-gecko/app/build.gradle.kts
          grep -q 'isDebuggable = false' android-gecko/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("production")' android-gecko/app/build.gradle.kts

      - name: Build signed Android release APK
        run: gradle -p android-gecko :app:assembleRelease --stacktrace

      - name: Verify release signature, identity, and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="android-gecko/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"

          SIGNER_SHA256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt"               | head -n 1               | tr '[:upper:]' '[:lower:]'               | tr -d ':[:space:]'
          )"
          EXPECTED_SIGNER="$(
            printf '%s' "$BKE_ANDROID_SIGNING_CERT_SHA256"               | tr '[:upper:]' '[:lower:]'               | tr -d ':[:space:]'
          )"

          [[ "$SIGNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$SIGNER_SHA256" = "$EXPECTED_SIGNER"

          DEBUGGABLE="$(apkanalyzer manifest debuggable "$APK" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          test "$DEBUGGABLE" = "false"

          VERSION_NAME="$(apkanalyzer manifest version-name "$APK" | tr -d '[:space:]')"
          VERSION_CODE="$(apkanalyzer manifest version-code "$APK" | tr -d '[:space:]')"
          test "$VERSION_NAME" = "0.0.1"
          test "$VERSION_CODE" = "1"

          mkdir -p artifacts/android-production
          OUTPUT_APK="artifacts/android-production/BKE.Worker.Android.arm64-v${VERSION_NAME}.apk"
          cp "$APK" "$OUTPUT_APK"
          APK_SHA256="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"

          SOURCE_SHA="$SOURCE_SHA"           APK_SHA256="$APK_SHA256"           SIGNER_SHA256="$SIGNER_SHA256"           VERSION_NAME="$VERSION_NAME"           VERSION_CODE="$VERSION_CODE"           python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "source_sha": os.environ["SOURCE_SHA"],
              "component": "BKE Worker Android Gecko",
              "architecture": "arm64-v8a",
              "version_name": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "sha256": os.environ["APK_SHA256"],
              "signer_certificate_sha256": os.environ["SIGNER_SHA256"],
              "certification_state": "production-candidate",
          }
          Path("artifacts/android-production/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload signed production candidate
        uses: actions/upload-artifact@v4
        with:
          name: bke-worker-android-production-candidate
          path: artifacts/android-production
          if-no-files-found: error
          retention-days: 30

      - name: Diff hygiene
        run: git diff --check


  relay:
    name: Cloudflare durable relay
    needs: plan
    if: needs.plan.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare relay protocol and config
        working-directory: cloudflare-relay
        run: npm run check

      - name: Verify Android/relay cross-boundary contract
        run: python3 tests/cloudflare_relay_contract.py

      - name: Execute local Worker + Durable Object smoke
        working-directory: cloudflare-relay
        shell: bash
        env:
          BKE_WORKER_GITHUB_WEBHOOK_SECRET: relay-ci-webhook-secret
          BKE_WORKER_RELAY_TOKEN_KEY: relay-ci-master-key-0123456789abcdef
          BKE_RELAY_SMOKE_URL: http://127.0.0.1:8790
        run: |
          set -euo pipefail
          npx --yes wrangler@4.147.0 dev \
            --local \
            --env preproduction \
            --ip 127.0.0.1 \
            --port 8790 \
            --log-level warn \
            > /tmp/bke-worker-relay-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..60}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8790/ || true)"
            if [[ "$status" != "000" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/bke-worker-relay-wrangler.log
            exit 1
          fi

          npm run runtime-smoke

      - name: Diff hygiene
        run: git diff --check

  required-certification:
    name: Required certification
    if: always() && needs.plan.result == 'success'
    needs: [plan, core, server, chatgpt, android, android-preproduction, android-release, relay]
    runs-on: ubuntu-latest
    steps:
      - name: Require requested exact-head proof
        shell: bash
        env:
          CORE_REQUIRED: ${{ needs.plan.outputs.core }}
          SERVER_REQUIRED: ${{ needs.plan.outputs.server }}
          CHATGPT_REQUIRED: ${{ needs.plan.outputs.chatgpt }}
          ANDROID_REQUIRED: ${{ needs.plan.outputs.android }}
          ANDROID_PREPRODUCTION_REQUIRED: ${{ needs.plan.outputs.android_preproduction }}
          ANDROID_RELEASE_REQUIRED: ${{ needs.plan.outputs.android_release }}
          RELAY_REQUIRED: ${{ needs.plan.outputs.relay }}
          CORE_RESULT: ${{ needs.core.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          CHATGPT_RESULT: ${{ needs.chatgpt.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_PREPRODUCTION_RESULT: ${{ needs.android-preproduction.result }}
          ANDROID_RELEASE_RESULT: ${{ needs.android-release.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$CORE_REQUIRED" != "true" || "$CORE_RESULT" == "success" ]]
          [[ "$SERVER_REQUIRED" != "true" || "$SERVER_RESULT" == "success" ]]
          [[ "$CHATGPT_REQUIRED" != "true" || "$CHATGPT_RESULT" == "success" ]]
          [[ "$ANDROID_REQUIRED" != "true" || "$ANDROID_RESULT" == "success" ]]
          [[ "$ANDROID_PREPRODUCTION_REQUIRED" != "true" || "$ANDROID_PREPRODUCTION_RESULT" == "success" ]]
          [[ "$ANDROID_RELEASE_REQUIRED" != "true" || "$ANDROID_RELEASE_RESULT" == "success" ]]
          [[ "$RELAY_REQUIRED" != "true" || "$RELAY_RESULT" == "success" ]]
          echo "Required certification PASS on exact head $SOURCE_SHA"
