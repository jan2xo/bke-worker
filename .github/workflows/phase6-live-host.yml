name: Phase 6 Live Host Guardrails
on: [push, pull_request]

jobs:
  live-host-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate operator scripts
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          grep -q -- '--remote-debugging-address="$CDP_HOST"' scripts/start-chatgpt-browser.sh
          grep -q 'CDP_HOST="127.0.0.1"' scripts/start-chatgpt-browser.sh
          ! grep -R -- '--no-sandbox' scripts

      - name: Restore Phase 6 projects
        run: |
          dotnet restore src/BKE.Worker.Server/BKE.Worker.Server.csproj
          dotnet restore tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj
          dotnet restore tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          dotnet restore tools/BKE.Worker.Notion.DispatchSmoke/BKE.Worker.Notion.DispatchSmoke.csproj

      - name: Build Phase 6 projects
        run: |
          dotnet build src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-restore
          dotnet build tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj --configuration Release --no-restore
          dotnet build tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj --configuration Release --no-restore
          dotnet build tools/BKE.Worker.Notion.DispatchSmoke/BKE.Worker.Notion.DispatchSmoke.csproj --configuration Release --no-restore

      - name: Certify authentication hard-stop before Notion
        run: dotnet test tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Install controlled Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Certify controlled adapter and live CDP guardrails
        run: dotnet test tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Certify live chatgpt.com is not ready without loopback CDP
        run: |
          set -euo pipefail
          dotnet publish src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-build --output artifacts/bke-worker-server

          export ASPNETCORE_URLS=http://127.0.0.1:5086
          export BKE_WORKER_NOTION_TOKEN=phase6-fixture-token
          export BKE_WORKER_NOTION_PAGE=aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
          export BKE_WORKER_CHATGPT_PROJECT="BKE Worker"
          export BKE_WORKER_CHATGPT_CONVERSATION="Worker Engineering"
          export BKE_WORKER_CHATGPT_BASE_URL=https://chatgpt.com/
          export BKE_WORKER_GITHUB_WEBHOOK_SECRET=phase6-fixture-secret
          export BKE_WORKER_STATE_FILE="$RUNNER_TEMP/bke-worker-phase6/state.json"
          unset BKE_WORKER_BROWSER_CDP_ENDPOINT

          dotnet artifacts/bke-worker-server/BKE.Worker.Server.dll > "$RUNNER_TEMP/phase6-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5086/health/live >/dev/null; then
              break
            fi
            sleep 1
          done

          code=$(curl --silent --output "$RUNNER_TEMP/phase6-ready.json" --write-out '%{http_code}' http://127.0.0.1:5086/health/ready)
          test "$code" = "503"
          grep -q '"status":"not_ready"' "$RUNNER_TEMP/phase6-ready.json"

          summary=$(curl --fail --silent http://127.0.0.1:5086/control/summary)
          echo "$summary" | grep -q '"browserCdpConfigured":false'
          echo "$summary" | grep -q '"liveChatGptRequiresCdp":true'

          echo 'PHASE6 LIVE HOST GUARDRAILS: GREEN'
