name: Phase 3 Hardening
on: [push, pull_request]

jobs:
  failure-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore hardening projects
        run: |
          set -euo pipefail
          dotnet restore tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          dotnet restore src/BKE.Worker.Server/BKE.Worker.Server.csproj

      - name: Build hardening projects
        run: |
          set -euo pipefail
          dotnet build tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj --configuration Release --no-restore
          dotnet build src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Publish actual VPS server
        run: dotnet publish src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-build --output artifacts/bke-worker-server

      - name: Certify browser failures, state safety, readiness, and deployment unit
        run: bash tests/integration/phase3_hardening.sh

      - name: Certify atomic state temp-file recovery
        run: bash tests/integration/phase3_state_atomicity.sh
