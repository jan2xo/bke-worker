name: Serial Master Queue Dispatcher

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request_target:
    types: [closed, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bke-worker-serial-dispatcher
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile GitHub Master Queue
    if: github.repository == 'jan2xo/bke-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch dispatcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify dispatcher source is default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "$DEFAULT_BRANCH"

      - name: Mint scoped BKE GitHub App installation token
        shell: bash
        env:
          BKE_GITHUB_APP_BROKER_URL: ${{ vars.BKE_WORKER_GITHUB_APP_BROKER_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${BKE_GITHUB_APP_BROKER_URL:-}" ]]; then
            echo "BKE dispatcher FAIL-CLOSED: BKE_WORKER_GITHUB_APP_BROKER_URL repository variable is required" >&2
            exit 3
          fi

          audience="bke-worker-github-app-broker"
          encoded_audience="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$audience")"
          separator="?"
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *"?"* ]]; then
            separator="&"
          fi

          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${encoded_audience}")"
          oidc_token="$(OIDC_JSON="$oidc_json" python3 -c 'import json, os; p=json.loads(os.environ["OIDC_JSON"]); v=p.get("value"); assert isinstance(v,str) and v, "OIDC response missing value"; print(v)')"

          broker_url="${BKE_GITHUB_APP_BROKER_URL%/}/github/app/install-token"
          broker_response_file="$(mktemp)"
          trap 'rm -f "$broker_response_file"' EXIT
          broker_status="$(
            curl --silent --show-error --output "$broker_response_file" --write-out '%{http_code}'               --request POST               -H "Authorization: Bearer $oidc_token"               -H "Accept: application/json"               "$broker_url"
          )"
          broker_json="$(cat "$broker_response_file")"

          if [[ ! "$broker_status" =~ ^2[0-9][0-9]$ ]]; then
            broker_error="$(
              BROKER_JSON="$broker_json" python3 -c 'import json, os, re; p=json.loads(os.environ.get("BROKER_JSON") or "{}"); v=p.get("error"); v=v if isinstance(v,str) else "GITHUB_APP_BROKER_FAILED"; v=re.sub(r"[^A-Za-z0-9_:=;,. -]", "?", v)[:240]; print(v)'
            )"
            echo "BKE dispatcher FAIL-CLOSED: broker rejected token request status=$broker_status error=$broker_error" >&2
            exit 22
          fi

          app_token="$(BROKER_JSON="$broker_json" python3 -c 'import json, os; p=json.loads(os.environ["BROKER_JSON"]); v=p.get("token"); assert isinstance(v,str) and v, "broker response missing token"; print(v)')"
          expires_at="$(BROKER_JSON="$broker_json" python3 -c 'import json, os; p=json.loads(os.environ["BROKER_JSON"]); v=p.get("expires_at"); assert isinstance(v,str) and v, "broker response missing expiry"; print(v)')"
          repository="$(BROKER_JSON="$broker_json" python3 -c 'import json, os; p=json.loads(os.environ["BROKER_JSON"]); print(p.get("repository") or "")')"
          test "$repository" = "jan2xo/bke-worker"

          echo "::add-mask::$app_token"
          echo "BKE_GITHUB_APP_TOKEN=$app_token" >> "$GITHUB_ENV"
          echo "BKE GitHub App installation token minted; expires_at=$expires_at"

      - name: Reconcile serial queue
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          BKE_WORKER_ID: android-worker-a
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="$BKE_GITHUB_APP_TOKEN"
          python3 scripts/github_serial_dispatcher.py

      - name: Request safe continuation after progress lease
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          BKE_WORKER_ID: android-worker-a
          BKE_CONTINUATION_ONLY: "true"
        run: |
          set -euo pipefail
          export GITHUB_TOKEN="$BKE_GITHUB_APP_TOKEN"
          python3 scripts/github_serial_dispatcher.py


