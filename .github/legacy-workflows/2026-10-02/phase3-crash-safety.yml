name: Phase 3 Crash Safety
on: [push, pull_request]

jobs:
  crash-after-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore crash-safety certification projects
        run: |
          set -euo pipefail
          dotnet restore tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj
          dotnet restore tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj
          dotnet restore src/BKE.Worker.Server/BKE.Worker.Server.csproj

      - name: Build crash-safety certification projects
        run: |
          set -euo pipefail
          dotnet build tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj --configuration Release --no-restore
          dotnet build tests/BKE.Worker.ChatGPT.Tests/BKE.Worker.ChatGPT.Tests.csproj --configuration Release --no-restore
          dotnet build src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-restore

      - name: Certify fail-closed uncertain-dispatch state contract
        run: dotnet test tests/BKE.Worker.Core.Tests/BKE.Worker.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Install Playwright Chromium
        run: pwsh tests/BKE.Worker.ChatGPT.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Publish actual VPS server
        run: dotnet publish src/BKE.Worker.Server/BKE.Worker.Server.csproj --configuration Release --no-build --output artifacts/bke-worker-server

      - name: Certify crash-after-send fail-closed guard
        run: bash tests/integration/phase3_crash_window.sh
